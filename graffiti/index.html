<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Граффити</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#141414;color:#ececec;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:8px;border-radius:16px;overflow:hidden;touch-action:none;background:#f0eee9}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#tex{mix-blend-mode:multiply}
#hint{position:absolute;left:0;right:70px;top:40%;text-align:center;color:rgba(40,36,30,.5);font-size:14px;pointer-events:none;transition:opacity .6s;padding:0 24px}
#pal{position:fixed;left:0;top:0;display:grid;gap:7px;padding:20px 7px 7px;background:rgba(22,22,22,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;z-index:2;box-shadow:0 6px 24px rgba(0,0,0,.25);touch-action:none;transition:left .18s,top .18s}
#pal.drag{transition:none}
#pal .sw,#pal .ic{width:32px;height:32px}
#pal .sw.on::after{inset:-4px}
#grip{position:absolute;left:0;right:0;top:0;height:20px;display:flex;justify-content:center;align-items:center;cursor:grab;touch-action:none}
#grip::before{content:"";width:22px;height:4px;border-radius:2px;background:#666}
#corner{position:absolute;right:-9px;bottom:-9px;width:26px;height:26px;border-radius:50%;background:#2a2a2a;border:1px solid #3a3a3a;display:grid;place-items:center;touch-action:none;cursor:nwse-resize}
#corner svg{width:12px;height:12px}
.sw{width:36px;height:36px;border-radius:50%;border:none;padding:0;position:relative;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #ececec}
.sw s{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(0,0,0,.28);text-decoration:none}
.sw.lt s{background:rgba(0,0,0,.18)}.sw.dk s{background:rgba(255,255,255,.3)}
.sep{height:1px;width:26px;background:#3a3a3a;flex:none}
.ic{width:38px;height:38px;border-radius:10px;background:#202020;border:1px solid #2e2e2e;color:#ddd;display:grid;place-items:center;flex:none;cursor:pointer;padding:0}
.ic svg{width:20px;height:20px}
#back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:12px;right:12px;top:50%;max-width:460px;margin:0 auto;max-height:86%;overflow-y:auto;background:#1a1a1a;border-radius:20px;padding:14px 16px 8px;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#sheet.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.ttl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a;margin:14px 0 8px}
.ttl:first-child{margin-top:2px}
#cans{display:flex;gap:10px;align-items:center;padding:4px 4px 2px}
#cans .sw{width:34px;height:34px}
#cans .sep{width:1px;height:24px}
#pv{width:100%;height:110px;display:block;border-radius:12px;margin:10px 0 4px;background:#ebe8e3}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;background:#242424;border:1px solid #303030;border-radius:999px;padding:7px 12px 7px 9px;color:#ddd;font-size:13px;cursor:pointer}
.chip i{display:flex}.chip i b{width:12px;height:12px;border-radius:50%;margin-right:-3px;box-shadow:0 0 0 1.5px #242424}
.chip em{display:block;background:#ddd;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;margin:4px 0}
.row label{width:112px;font-size:14px;color:#cfcfcf;flex:none}
.row label small{display:block;font-size:11px;color:#7a7a7a}
.sl{position:relative;height:40px;flex:1}
.sl .tr{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:5px;background:linear-gradient(90deg,#2e2e2e,#5a5a5a)}
.sl input{position:absolute;inset:0;width:100%;height:40px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.sl input::-webkit-slider-runnable-track{background:transparent;height:40px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:7px;border-radius:50%;background:#fff;border:3px solid #141414;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.sl input::-moz-range-track{background:transparent}
.sl input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #141414}
.off{opacity:.3;pointer-events:none}
#note{font-size:13px;color:#8a8a8a;margin:2px 0 4px}
.btns{display:flex;gap:10px;margin:14px 0 8px}
.btns button{flex:1;height:44px;border-radius:12px;border:1px solid #303030;background:#242424;color:#e6e6e6;font-size:15px;cursor:pointer}
.btns button.pri{background:#ececec;color:#141414;border-color:#ececec}
</style>
</head>
<body>
<div id="stage"><canvas id="pt"></canvas><canvas id="tex"></canvas>
  <div id="hint">Каждый палец — свой баллончик.<br>Держи на месте — пятно растёт.<br>Палитру таскай за полоску, форму меняй уголком.<br>Нажми на баллончик ещё раз,<br>чтобы настроить цвет и сопло.</div></div>
<div id="pal"><div id="grip"></div><div id="corner"><svg viewBox="0 0 12 12" stroke="#bbb" stroke-width="1.6" stroke-linecap="round"><path d="M11 4 4 11M11 8 8 11"/></svg></div>
  <button class="ic" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>
<div id="back"></div>
<div id="sheet">
  <div class="ttl">Баллончик</div>
  <div id="cans"></div>
  <canvas id="pv"></canvas>
  <div class="ttl">Сопло</div>
  <div class="chips" id="noz"></div>
  <div class="row"><label>Форма<small>круг → плоская</small></label><div class="sl"><div class="tr"></div><input type="range" id="shape" min="0" max="1" step="0.01"></div></div>
  <div class="row" id="angRow"><label>Угол</label><div class="sl"><div class="tr"></div><input type="range" id="ang" min="0" max="180" step="1"></div></div>
  <div class="row"><label>Плотность<small>редко → густо</small></label><div class="sl"><div class="tr"></div><input type="range" id="dens" min="0" max="1" step="0.01"></div></div>
  <div class="row"><label>Толщина</label><div class="sl"><div class="tr"></div><input type="range" id="size" min="5" max="60" step="0.5"></div></div>
  <div class="ttl">Цвет</div>
  <div class="chips" id="pals"></div>
  <div id="note"></div>
  <div id="ed">
    <div class="row"><label>Температура</label><div class="sl"><div class="tr" id="b0"></div><input type="range" id="t" min="0" max="1" step="0.002"></div></div>
    <div class="row"><label>Насыщенность</label><div class="sl"><div class="tr" id="b1"></div><input type="range" id="s" min="0" max="1" step="0.002"></div></div>
    <div class="row"><label>Яркость</label><div class="sl"><div class="tr" id="b2"></div><input type="range" id="v" min="0.06" max="1" step="0.002"></div></div>
  </div>
  <div class="ttl">Стена</div>
  <div class="row"><label>Текучесть<small>подтёки</small></label><div class="sl"><div class="tr"></div><input type="range" id="flow" min="0" max="1" step="0.01"></div></div>
  <div class="btns"><button id="clr">Очистить стену</button><button class="pri" id="done">Готово</button></div>
</div>
<script>
(()=>{
const el=id=>document.getElementById(id);
const ss=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
// ---------- colors & cans ----------
const HMAX=320;
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));
  return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6]}
const css=(c,a=1)=>'rgba('+c.map(v=>Math.round(v*255)).join(',')+','+a+')';
const P=(h,s,v)=>({t:h/HMAX,s,v});
const PALS=[
  ['Яркая',[P(0,.88,.88),P(48,.92,.98),P(218,.88,.8),P(322,.8,.82),P(150,.75,.7)]],
  ['Неон',[P(320,.85,1),P(105,.85,1),P(24,1,1),P(185,1,1),P(270,.75,1)]],
  ['Пастель',[P(350,.36,.97),P(45,.42,.98),P(205,.38,.95),P(280,.3,.92),P(150,.34,.9)]],
  ['Город',[P(210,.25,.55),P(30,.5,.75),P(0,.75,.72),P(48,.85,.95),P(160,.4,.5)]],
];
const NOZ=[
  ['Круглое',{shape:0,ang:0,dens:.85,size:22},[14,14]],
  ['Тонкое',{shape:0,ang:0,dens:.95,size:8},[7,7]],
  ['Плоское',{shape:.82,ang:20,dens:.85,size:30},[18,6]],
  ['Брызги',{shape:0,ang:0,dens:.08,size:28},[12,12]],
  ['Широкое',{shape:0,ang:0,dens:.75,size:54},[18,18]],
];
const defNoz=()=>({...NOZ[0][1]});
let cans,sel=0,flow=0.2;
try{const d=JSON.parse(localStorage.getItem('graf2')||'null');if(d&&d.cans&&d.cans.length===7){cans=d.cans;flow=d.flow??flow}}catch(e){}
if(!cans)cans=[...PALS[0][1].map(c=>({...c,...defNoz()})),{t:0,s:0,v:1,...defNoz()},{t:0,s:0,v:0,...defNoz()}];
const save=()=>{try{localStorage.setItem('graf2',JSON.stringify({cans,flow}))}catch(e){}};
const colOf=k=>k===5?[0.97,0.97,0.96]:k===6?[0.07,0.07,0.08]:hsv(cans[k].t*HMAX,cans[k].s,cans[k].v);
// ---------- spray ----------
function gs(){return Math.sqrt(-2*Math.log(Math.random()+1e-9))*Math.cos(6.2832*Math.random())}
let wetAdd=null,noWet=false;
// paint one puff of can k at (x,y); f = share of this frame's paint (for strokes split into steps)
function spray(c,x,y,k,dw,f){
  const o=cans[k],col=colOf(k),d=o.dens;
  const R=o.size*(1+1.3*ss(0,1.6,dw)), sh=1-o.shape*0.85, a=o.ang*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  // soft core: mist that builds solid colour
  const al=(0.03+0.3*d*d+0.06*d)*f;
  c.save();c.translate(x,y);c.rotate(a);c.scale(1,sh);
  const g=c.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,css(col,al));g.addColorStop(0.4,css(col,al*0.7));g.addColorStop(1,css(col,0));
  c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,6.2832);c.fill();c.restore();
  // droplets
  const n=Math.round(Math.min(900,(26+230*d)*(R/22)+(1-d)*18)*f+Math.random());
  const dr=0.6+2.1*(1-d)*(1-d);
  c.fillStyle=css(col);
  for(let i=0;i<n;i++){
    const spread=Math.random()<0.12?0.85:0.42;
    const lx=gs()*spread*R,ly=gs()*spread*R*sh;
    const px=x+lx*ca-ly*sa,py=y+lx*sa+ly*ca;
    const r=dr*(0.35+Math.random()*Math.random()*1.7);
    const A=0.45+0.55*Math.random();c.globalAlpha=A;
    if(r<0.9)c.fillRect(px-r,py-r,2*r,2*r);else{c.beginPath();c.arc(px,py,r,0,6.2832);c.fill()}
    if(wetAdd&&!noWet)wetAdd(px,py,A*r*r*3.14/36,k)}
  c.globalAlpha=1;
  if(wetAdd&&!noWet)wetAdd(x,y,al*R*R*sh*1.2/36,k);
  return R}
// ---------- swatches ----------
function mkSw(parent,list,onTap,before){
  for(let k=0;k<7;k++){
    if(k===5&&!before){const d=document.createElement('div');d.className='sep';parent.appendChild(d)}
    const b=document.createElement('button');b.className='sw';b.innerHTML='<s></s>';b.onclick=()=>onTap(k);before?parent.insertBefore(b,before):parent.appendChild(b);list.push(b)}}
const dots=[],cdots=[];
mkSw(el('pal'),dots,k=>{if(moved)return;if(sel===k&&!isOpen())openSheet(true);else{sel=k;refresh()}},el('gear'));
mkSw(el('cans'),cdots,k=>{sel=k;refresh()});
// nozzle & palette chips
NOZ.forEach(([name,n,[w,h]])=>{const c=document.createElement('button');c.className='chip';
  c.innerHTML='<em style="width:'+w+'px;height:'+h+'px;'+(name==='Брызги'?'background:radial-gradient(circle,#ddd 1.5px,transparent 2px) 0 0/5px 5px;':'')+(name==='Плоское'?'transform:rotate(-20deg);':'')+'"></em>'+name;
  c.onclick=()=>{Object.assign(cans[sel],n);refresh();save()};el('noz').appendChild(c)});
PALS.forEach(([name,cols])=>{const c=document.createElement('button');c.className='chip';
  c.innerHTML='<i>'+cols.map(o=>'<b style="background:'+css(hsv(o.t*HMAX,o.s,o.v))+'"></b>').join('')+'</i>'+name;
  c.onclick=()=>{cols.forEach((o,k)=>Object.assign(cans[k],o));refresh();save()};el('pals').appendChild(c)});
function refresh(){
  for(const D of [dots,cdots])D.forEach((d,k)=>{const c=colOf(k);d.style.background=css(c);d.classList.toggle('on',k===sel);
    const L=c[0]*.3+c[1]*.59+c[2]*.11;d.classList.toggle('lt',L>.7);d.classList.toggle('dk',L<.25);
    const o=cans[k],s=d.querySelector('s'),w=6+o.size/60*12,h=w*(1-o.shape*0.8);
    s.style.width=w+'px';s.style.height=h+'px';s.style.margin=(-h/2)+'px 0 0 '+(-w/2)+'px';s.style.transform='rotate('+o.ang+'deg)'});
  const o=cans[sel],on=sel<5;
  el('shape').value=o.shape;el('ang').value=o.ang;el('dens').value=o.dens;el('size').value=o.size;el('flow').value=flow;
  el('angRow').classList.toggle('off',o.shape<0.08);
  el('ed').classList.toggle('off',!on);
  el('note').textContent=on?'':sel===5?'Белый баллончик: цвет не настраивается, сопло — да.':'Чёрный баллончик: цвет не настраивается, сопло — да.';
  el('note').style.display=on?'none':'block';
  el('t').value=o.t;el('s').value=o.s;el('v').value=o.v;
  const st=[];for(let k=0;k<=10;k++)st.push(css(hsv(k/10*HMAX,Math.max(o.s,.25),Math.max(o.v,.5))));
  el('b0').style.background='linear-gradient(90deg,'+st.join(',')+')';
  el('b1').style.background='linear-gradient(90deg,'+css(hsv(o.t*HMAX,0,o.v))+','+css(hsv(o.t*HMAX,1,o.v))+')';
  el('b2').style.background='linear-gradient(90deg,#000,'+css(hsv(o.t*HMAX,o.s,1))+')';
  pvDirty=true}
['shape','ang','dens','size','t','s','v'].forEach(k=>el(k).addEventListener('input',e=>{
  if('tsv'.includes(k)&&sel>4)return;cans[sel][k]=+e.target.value;refresh();save()}));
el('flow').addEventListener('input',e=>{flow=+e.target.value;save()});
const sheet=el('sheet'),isOpen=()=>sheet.classList.contains('open');
function openSheet(v){sheet.classList.toggle('open',v);el('back').classList.toggle('open',v);if(v){sizePv();pvDirty=true}}
el('gear').onclick=()=>openSheet(!isOpen());el('done').onclick=()=>openSheet(false);el('back').onclick=()=>openSheet(false);
// ---------- movable palette ----------
const pal=el('pal');let moved=false;
let PS={cols:1,x:null,y:null};
try{const d=JSON.parse(localStorage.getItem('graf-pal')||'null');if(d)PS=d}catch(e){}
const savePS=()=>{try{localStorage.setItem('graf-pal',JSON.stringify(PS))}catch(e){}};
function placePal(snap){
  pal.style.gridTemplateColumns='repeat('+PS.cols+',32px)';
  const w=pal.offsetWidth,h=pal.offsetHeight,VW=innerWidth,VH=innerHeight,m=10;
  if(PS.x===null){PS.x=VW-w-14;PS.y=(VH-h)/2}
  let x=Math.min(Math.max(m,PS.x),VW-w-m),y=Math.min(Math.max(m,PS.y),VH-h-m);
  if(snap){const S=36;if(x<S)x=m;if(VW-w-x<S)x=VW-w-m;if(y<S)y=m;if(VH-h-y<S)y=VH-h-m}
  PS.x=x;PS.y=y;pal.style.left=x+'px';pal.style.top=y+'px'}
function dragOn(node,onMove,onEnd){
  node.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();node.setPointerCapture(e.pointerId);
    const sx=e.clientX,sy=e.clientY,st={...PS};pal.classList.add('drag');
    const mv=ev=>onMove(ev.clientX-sx,ev.clientY-sy,st);
    const up=()=>{node.removeEventListener('pointermove',mv);node.removeEventListener('pointerup',up);node.removeEventListener('pointercancel',up);
      pal.classList.remove('drag');onEnd();savePS()};
    node.addEventListener('pointermove',mv);node.addEventListener('pointerup',up);node.addEventListener('pointercancel',up)})}
dragOn(el('grip'),(dx,dy,st)=>{PS.x=st.x+dx;PS.y=st.y+dy;placePal(false)},()=>placePal(true));
// drag the corner: wider -> more columns (column, square, row)
dragOn(el('corner'),(dx,dy,st)=>{
  const w0=st.cols*39+7,h0=Math.ceil(8/st.cols)*39+20;
  const want=Math.max(w0+dx,32);const wantH=Math.max(h0+dy,32);
  let c=Math.round((want-7)/39);
  if(Math.abs(dy)>Math.abs(dx))c=Math.ceil(8/Math.max(1,Math.round((wantH-20)/39)));
  c=Math.max(1,Math.min(8,c));if(c!==PS.cols){PS.cols=c;placePal(false)}},()=>placePal(true));
addEventListener('resize',()=>placePal(true));
requestAnimationFrame(()=>placePal(true));
// ---------- preview ----------
const pv=el('pv'),pc=pv.getContext('2d');let pvDirty=true;
function sizePv(){const d=Math.min(devicePixelRatio||1,3);pv.width=pv.clientWidth*d;pv.height=pv.clientHeight*d;pc.setTransform(d,0,0,d,0,0)}
function drawPv(){
  const w=pv.clientWidth,h=pv.clientHeight;if(!w)return;
  pc.clearRect(0,0,w,h);noWet=true;
  for(let i=0;i<34;i++)spray(pc,w*0.2,h*0.5,sel,i/34*1.6,1);           // held: patch grows
  for(let i=0;i<=40;i++){const t=i/40;spray(pc,w*(0.42+0.52*t),h*(0.5+0.18*Math.sin(t*6.28)),sel,0,0.5)} // stroke
  noWet=false;
}
// ---------- wall (concrete) ----------
const stage=el('stage'),pt=el('pt'),tex=el('tex'),ctx=pt.getContext('2d');
function hash(x,y){let n=(x*374761393+y*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
function vn(x,y,s){const gx=x/s,gy=y/s,x0=Math.floor(gx),y0=Math.floor(gy);
  let fx=gx-x0,fy=gy-y0;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=hash(x0,y0),b=hash(x0+1,y0),c=hash(x0,y0+1),d=hash(x0+1,y0+1);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function makeWall(W,H){
  const k=Math.min(devicePixelRatio||1,2),w=Math.round(W*k),h=Math.round(H*k);
  tex.width=w;tex.height=h;const t=tex.getContext('2d'),im=t.createImageData(w,h),p=im.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const X=x/k,Y=y/k;
    const big=vn(X,Y,220)*0.5+vn(X+90,Y,90)*0.3+vn(X,Y+40,35)*0.2;     // soft stains
    const fine=vn(x,y,2.2)*0.6+hash(x,y)*0.4;                        // grain
    let v=251-9*big-6*fine;
    const i=(y*w+x)*4;p[i]=v;p[i+1]=v-1;p[i+2]=v-3;p[i+3]=255}
  t.putImageData(im,0,0);
  // pores
  for(let i=0;i<W*H/900;i++){const x=Math.random()*w,y=Math.random()*h,r=(0.4+Math.random()*Math.random()*1.6)*k;
    t.fillStyle='rgba(130,122,110,'+(0.06+Math.random()*0.12)+')';t.beginPath();t.arc(x,y,r,0,6.2832);t.fill()}
}
// ---------- wetness & drips ----------
const CELL=6;let gw=0,gh=0,wet=null,wcol=null;const drips=[];
wetAdd=(x,y,m,k)=>{if(!wet)return;const cx=x/CELL|0,cy=y/CELL|0;if(cx<0||cy<0||cx>=gw||cy>=gh)return;const i=cy*gw+cx;wet[i]+=m;wcol[i]=k};
function dripsStep(){
  const thr=flow<0.3?1e9:16+90*(1-flow)*(1-flow);
  const POOL=3.5;
  for(let i=0;i<wet.length;i++){let v=wet[i];if(v<=0.001){wet[i]=0;continue}
    if(v>POOL){ // heavy paint merges into a solid wet film: no gaps between droplets
      const x=(i%gw+0.5)*CELL,y=((i/gw|0)+0.5)*CELL,r=CELL*(0.75+0.35*Math.min(1,(v-POOL)/8));
      const g=ctx.createRadialGradient(x,y,0,x,y,r);const c=colOf(wcol[i]);
      g.addColorStop(0,css(c,0.85));g.addColorStop(0.6,css(c,0.6));g.addColorStop(1,css(c,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();v-=0.35}
    if(v>thr&&drips.length<160){const x=(i%gw+0.2+Math.random()*0.6)*CELL,y=((i/gw|0)+0.7)*CELL;
      drips.push({x,y,m:(v-thr*0.45)*0.5,col:css(colOf(wcol[i]),0.96)});v=thr*0.45}
    wet[i]=v*0.993}
  const H=pt.clientHeight;ctx.lineCap='round';
  for(let j=drips.length-1;j>=0;j--){const d=drips[j];
    const sp=(0.05+0.45*flow)*(0.35+0.65*Math.min(1,d.m/14));
    const w=Math.min(6,1.6+d.m*0.2),ny=d.y+sp,nx=d.x+(Math.random()-0.5)*0.12;
    ctx.strokeStyle=d.col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(nx,ny);ctx.stroke();
    d.m-=sp*w*0.3;d.x=nx;d.y=ny;
    if(d.m<=0||ny>H){ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(nx,ny,w*0.85,0,6.2832);ctx.fill();drips.splice(j,1)}}
}
// ---------- layout ----------
let W=0,Hh=0,dpr=1;
function setup(){
  const w=stage.clientWidth,h=stage.clientHeight;if(w<10||h<10||(w===W&&h===Hh))return;
  const old=W?(()=>{const c=document.createElement('canvas');c.width=pt.width;c.height=pt.height;c.getContext('2d').drawImage(pt,0,0);return c})():null;
  W=w;Hh=h;dpr=Math.min(devicePixelRatio||1,3);
  pt.width=Math.round(w*dpr);pt.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(old)ctx.drawImage(old,0,0,w,h);
  makeWall(w,h);
  gw=Math.ceil(w/CELL);gh=Math.ceil(h/CELL);wet=new Float32Array(gw*gh);wcol=new Uint8Array(gw*gh)}
new ResizeObserver(setup).observe(stage);setup();
el('clr').onclick=()=>{ctx.clearRect(0,0,W,Hh);wet.fill(0);drips.length=0;openSheet(false)};
// ---------- fingers ----------
const act=new Map();let hinted=false;
const pos=e=>{const r=stage.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function pick(n){if(sel<5)return(sel+n)%5;if(n===0)return sel;return(n-1)%5}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);const [x,y]=pos(e);
  act.set(e.pointerId,{x,y,px:x,py:y,k:pick(act.size),dw:0});
  if(!hinted){hinted=true;el('hint').style.opacity=0}});
stage.addEventListener('pointermove',e=>{const a=act.get(e.pointerId);if(!a)return;const [x,y]=pos(e);a.x=x;a.y=y});
const up=e=>act.delete(e.pointerId);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(const a of act.values()){
    const dx=a.x-a.px,dy=a.y-a.py,dist=Math.hypot(dx,dy);
    a.dw=a.dw*Math.exp(-dist*0.06)+dt;               // holding still -> wider, heavier patch
    const R=cans[a.k].size*(1+1.3*ss(0,1.6,a.dw));
    const n=Math.max(1,Math.ceil(dist/(R*0.3)));
    for(let i=1;i<=n;i++)spray(ctx,a.px+dx*i/n,a.py+dy*i/n,a.k,a.dw,1/n);
    a.px=a.x;a.py=a.y}
  if(wet)dripsStep();
  if(pvDirty&&isOpen()){pvDirty=false;drawPv()}
  requestAnimationFrame(frame)}
refresh();requestAnimationFrame(frame);
})();
</script>
