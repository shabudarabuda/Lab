<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Paint</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--dock:150px;--sw:34px;--gap:9px;--joy:78px;--flw:180px}
html,body{margin:0;height:100%;background:#141414;color:#ececec;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--dock));display:block;touch-action:none}
#reset{position:fixed;right:30px;top:30px;z-index:2;opacity:0;pointer-events:none;transition:opacity .2s;width:40px;height:40px}
#reset.show{opacity:1;pointer-events:auto}
#burger{position:fixed;right:30px;bottom:30px;z-index:2;width:38px;height:38px;background:rgba(32,32,32,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#menu{position:fixed;right:30px;bottom:78px;width:min(300px,calc(100% - 60px));max-height:calc(100% - 110px);overflow-y:auto;background:rgba(24,24,24,.97);border:1px solid #2c2c2c;border-radius:14px;padding:6px;z-index:5;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .15s,transform .15s}
#menu.open{opacity:1;pointer-events:auto;transform:none}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border:none;border-radius:9px;background:transparent;color:#ececec;font-size:15px;text-align:left;cursor:pointer}
.mi:active{background:#2a2a2a}
.mi svg{width:20px;height:20px;flex:none;color:#8a8a8a}
.mi small{margin-left:auto;color:#777;font-size:12px}
#sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 6px 4px}
.sz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:58px;border:1px solid #2e2e2e;border-radius:9px;background:#212121;color:#d0d0d0;font-size:13px;cursor:pointer;padding:0}
.sz i{display:block;border:1.5px solid #8a8a8a;border-radius:2px}
.sz .ar{height:24px;display:grid;place-items:center}
.sz.on{background:#2e2e2e;border-color:#6a6a6a;color:#fff}
.sz.on i{border-color:#ececec}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,8px);max-width:calc(100% - 40px);display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:rgba(236,236,236,.96);color:#141414;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{white-space:nowrap}#toast b{font-weight:600;text-decoration:underline;cursor:pointer;white-space:nowrap}
#shot{position:fixed;inset:0;z-index:8;background:rgba(10,10,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#shot.on{display:flex}
#shot img{max-width:100%;max-height:68%;border-radius:7px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#shot p{margin:0;color:#9a9a9a;font-size:13px;text-align:center}
#shot .btns{width:100%;max-width:360px}
#pals{display:grid!important;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:calc((100% - 24px)/3.3);gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding-bottom:6px;touch-action:pan-x;scrollbar-width:none}
#pals::-webkit-scrollbar{display:none}
#pdots{display:flex;justify-content:center;gap:5px;margin:0 0 6px;height:5px}
#pdots i{width:4px;height:4px;border-radius:50%;background:#555;transition:background .15s}
#pdots i.on{background:#bbb}
#pals .chip{scroll-snap-align:start;flex-direction:column;align-items:flex-start;gap:6px;border-radius:10px;padding:8px 10px;min-width:0}
#pals .chip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
#hint{position:fixed;left:20px;right:80px;top:28%;text-align:center;color:rgba(40,36,30,.5);font-size:14px;pointer-events:none;transition:opacity .6s}
#pal{position:fixed;left:0;top:0;display:grid;gap:var(--gap);padding:24px 6px 6px;background:rgba(22,22,22,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;z-index:2;box-shadow:0 6px 24px rgba(0,0,0,.25);touch-action:none;transition:left .18s,top .18s}
#pal.drag{transition:none}
.sw{width:var(--sw);height:var(--sw);border-radius:50%;border:none;padding:0;position:relative;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:grid;place-items:center;color:#cfe6f2}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #ececec}
.sw svg{width:14px;height:14px}
.ic{width:28px;height:28px;border-radius:8px;background:#202020;border:1px solid #2e2e2e;color:#858585;display:grid;place-items:center;cursor:pointer;padding:0}
.ic svg{width:16px;height:16px}
#grip{position:absolute;left:0;right:0;top:0;height:20px;display:flex;justify-content:center;align-items:center;cursor:grab;touch-action:none}
#grip::before{content:"";width:30px;height:12px;background:radial-gradient(circle,rgba(255,255,255,.28) 1.1px,transparent 1.6px) 0 0/6px 6px}
#corner{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:#2a2a2a;border:1px solid #3a3a3a;display:grid;place-items:center;touch-action:none;cursor:nwse-resize}
#corner svg{width:12px;height:12px}

.mv{position:fixed;left:0;top:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;transition:left .18s,top .18s}
.mv.drag{transition:none}
.grab{width:56px;height:26px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:30px;height:12px;background:radial-gradient(circle,rgba(255,255,255,.3) 1.1px,transparent 1.6px) 0 0/6px 6px}
#joy{position:relative;width:var(--joy);height:var(--joy);border-radius:50%;background:rgba(22,22,22,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#joy::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--joy)*.4);height:calc(var(--joy)*.4);margin:calc(var(--joy)*-.2);border-radius:50%;background:#e8e8e8;box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .15s}
#joy.drag #knob{transition:none}
#dry{width:54px;height:54px;border-radius:14px;border:none;padding:0;display:grid;place-items:center;touch-action:none;cursor:pointer;background:rgba(22,22,22,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.25);color:#e9c58c;transition:transform .12s}
#dry.on{transform:scale(.94);color:#ffd590}
#dry svg{width:32px;height:32px}
#pct{position:absolute;left:50%;top:-30px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;background:rgba(22,22,22,.82);text-align:center;font:600 14px/1 system-ui,-apple-system,Roboto,sans-serif;color:#f1d39f;opacity:0;transition:opacity .25s;pointer-events:none;font-variant-numeric:tabular-nums}
#pct.on{opacity:1}
.cap{font-size:11px;color:#8d877e;pointer-events:none;margin-top:2px}
#grip{height:24px}
#back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:12px;right:12px;top:50%;max-width:460px;margin:0 auto;max-height:86%;overflow-y:auto;background:#1a1a1a;border-radius:17px;padding:14px 16px 8px;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#sheet.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.ttl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a;margin:14px 0 8px}
.ttl:first-child{margin-top:2px}
#ssw{display:flex;gap:10px;align-items:center;padding:4px 4px 2px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:flex;gap:6px;align-items:center;background:#242424;border:1px solid #303030;border-radius:849px;padding:7px 12px 7px 8px;color:#ddd;font-size:13px;cursor:pointer}
.chip i{display:flex}.chip i b{width:12px;height:12px;border-radius:50%;margin-right:-3px;box-shadow:0 0 0 1.5px #242424}
.row{display:flex;align-items:center;gap:12px;margin:4px 0}
.row label{width:112px;font-size:14px;color:#cfcfcf;flex:none}
.row label small{display:block;font-size:11px;color:#7a7a7a}
.sl{position:relative;height:40px;flex:1}
.sl .tr{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:5px;background:linear-gradient(90deg,#2e2e2e,#5a5a5a)}
.sl input{position:absolute;inset:0;width:100%;height:40px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.sl input::-webkit-slider-runnable-track{background:transparent;height:40px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:7px;border-radius:50%;background:#fff;border:3px solid #141414;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.sl input::-moz-range-track{background:transparent}
.sl input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #141414}
.off{opacity:.3;pointer-events:none}
#note{font-size:13px;color:#8a8a8a;margin:2px 0 4px}
.seg{display:flex;gap:8px;margin:0 0 6px}
.seg button{flex:1;height:44px;border-radius:10px;border:1px solid #303030;background:#242424;color:#ddd;font-size:14px;cursor:pointer}
.seg button.on{background:#ececec;color:#141414;border-color:#ececec}
#joyW{display:none}
#flowW{flex-direction:row;align-items:center;gap:0;width:var(--flw);height:46px;background:rgba(32,32,32,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:10px}
#flowW .grab.gv{width:22px;height:100%;flex:none}
#flowW .grab.gv::before{width:12px;height:30px}
#fv{flex:1;min-width:0;height:100%;display:flex;align-items:center;padding:0 6px 0 2px;touch-action:none}
#ft{position:relative;flex:1;min-width:0;height:100%;touch-action:none}
#ft::before{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;border-radius:2px;background:#555}
#fthumb{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;pointer-events:none}
#fthumb svg{width:44px;height:44px;overflow:visible;display:block}
#fshape{fill:#cfcfcf;stroke:#cfcfcf;stroke-width:2.2;stroke-linejoin:round;paint-order:stroke}

#langs{display:flex;justify-content:space-between;gap:2px;margin:8px 6px 0}
#langs .lg{background:none;border:none;color:#757575;font:500 11.5px/1 system-ui,sans-serif;letter-spacing:.05em;padding:7px 8px;border-radius:7px;cursor:pointer}
#langs .lg.on{color:#f0f0f0;background:#2a2a2a}
#menu .ttl{margin:12px 6px 4px}
#menu .row{margin:0 6px}#menu .row label{width:96px;font-size:13px}
#menu .seg{margin:4px 6px}#menu .seg button{height:38px;font-size:13px}
#menu .btns{margin:8px 6px 4px}#menu .btns button{height:38px;font-size:14px}
#sizes{grid-template-columns:repeat(5,1fr)!important;gap:5px!important}
.sz{height:34px!important;font-size:12.5px!important}
.btns{display:flex;gap:10px;margin:14px 0 8px}
.btns button{flex:1;height:44px;border-radius:10px;border:1px solid #303030;background:#242424;color:#e6e6e6;font-size:15px;cursor:pointer}
.btns button.pri{background:#ececec;color:#141414;border-color:#ececec}
#gear{width:var(--sw);height:var(--sw);border-radius:50%;place-self:center;margin:0}
#gear svg{width:46%;height:46%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="pal"><div id="grip"></div><div id="corner"><svg viewBox="0 0 12 12" fill="none" stroke="#bbb" stroke-width="1.6" stroke-linecap="round"><path d="M11 4 4 11M11 8 8 11"/></svg></div>
  <button class="ic" id="gear" data-ia="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>
<div class="mv" id="flowW"><div class="grab gv"></div><div id="fv" data-ia="flow" aria-label="Flow"><div id="ft"><div id="fthumb"><svg viewBox="0 0 44 44"><path id="fshape" d=""/></svg></div></div></div></div>
<div class="mv" id="joyW"><div class="grab"></div><div id="joy"><div id="knob"></div></div></div>
<button class="ic" id="reset" data-ia="reset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
<button class="ic" id="burger" data-ia="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
<div id="menu">
  <button class="mi" id="m-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg><span data-i="save"></span></button>
  <div id="sizes"></div>
  <div class="ttl" data-i="paint"></div>
  <div class="row"><label><span data-i="dry"></span><small id="tauV"></small></label><div class="sl"><div class="tr"></div><input type="range" id="dryS" min="3" max="60" step="1"></div></div>
  <div class="row"><label><span data-i="jet"></span><small data-i="jetNote"></small></label><div class="sl"><div class="tr"></div><input type="range" id="bsz" min="0.25" max="3.5" step="0.01"></div></div>
  <div class="ttl" data-i="tilt"></div>
  <div class="seg"><button id="tiltS" data-i="sensor"></button><button id="tiltJ" data-i="joystick"></button></div>
  <div class="row"><label data-i="resp"></label><div class="sl"><div class="tr"></div><input type="range" id="sens" min="1" max="8" step="0.1"></div></div>
  <div class="btns" id="zeroB" style="margin:6px 6px 0"><button id="zero" data-i="zero"></button></div>
  <div id="langs"></div>
  <div class="btns"><button id="clr" data-i="clear"></button></div>
</div>
<div id="toast"><span id="toastT"></span><b id="toastB"></b></div>
<div id="shot"><img id="shotImg" alt=""><p data-i="shotHint"></p><div class="btns"><button class="pri" id="shotClose" data-i="close"></button></div></div>
<div id="back"></div>
<div id="sheet">
  <div class="ttl"><span data-i="color"></span> <span id="selN" style="text-transform:none;letter-spacing:0;color:#aaa"></span></div>
  <div id="ssw"></div>
  <div id="note"></div>
  <div class="chips" id="pals" style="margin:8px 0 6px"></div>
  <div id="pdots"></div>
  <div id="ed">
    <div class="row"><label data-i="temp"></label><div class="sl"><div class="tr" id="b0"></div><input type="range" id="t" min="0" max="1.125" step="0.002"></div></div>
    <div class="row"><label data-i="sat"></label><div class="sl"><div class="tr" id="b1"></div><input type="range" id="s" min="0" max="1" step="0.002"></div></div>
    <div class="row"><label data-i="bri"></label><div class="sl"><div class="tr" id="b2"></div><input type="range" id="v" min="0.06" max="1" step="0.002"></div></div>
  </div>
  <div class="btns"><button class="pri" id="done" data-i="done"></button></div>
</div>
<script>
// ---- gel paint simulation (mass-conserving, no texture) ----
function sstep(a,b,x){let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)}
function makeSim(nx,ny){
  const N=nx*ny,f=()=>new Float32Array(N);
  return {nx,ny,N,H:f(),R:f(),G:f(),B:f(),Wt:f(),nH:f(),nR:f(),nG:f(),nB:f(),nW:f(),
    Hs:f(),FX:f(),FY:f(),U:f(),V:f(),U2:f(),V2:f(),M:f(),D:f(),nD:f(),HD:f(),RD:f(),GD:f(),BD:f(),WD:f(),
    pW:f(),cWr:f(),cWg:f(),cWb:f(),pD:f(),cDr:f(),cDg:f(),cDb:f(),GL:f(),NX:f(),NY:f(),SH:f(),bW:f(),bD:f(),t0:f(),t1:f(),t2:f(),t3:f(),t4:f(),
    flow:0.5,tx:0,ty:0,tau:2.4};
}
// col = {A:[ar,ag,ab], w:0|1}; new paint covers what is underneath
function deposit(s,gx,gy,r,amt,col){
  const {nx,ny,H,R,G,B,Wt,D}=s,A=col.A,tw=col.w;
  const x0=Math.max(0,Math.floor(gx-r)),x1=Math.min(nx-1,Math.ceil(gx+r));
  const y0=Math.max(0,Math.floor(gy-r)),y1=Math.min(ny-1,Math.ceil(gy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const d=Math.hypot(x-gx,y-gy)/r;if(d>=1)continue;
    const a=amt*(0.5+0.5*Math.cos(d*Math.PI)),i=y*nx+x,h0=H[i];
    let f=1,mr=0,mg=0,mb=0,mw=0,md=0;
    if(h0>1e-4){f=Math.min(1,a*2/(0.04*h0+a*2));const ih=1/h0;mr=R[i]*ih;mg=G[i]*ih;mb=B[i]*ih;mw=Wt[i]*ih;md=D[i]*ih}
    const h1=h0+Math.min(a,Math.max(0,3.2-h0));if(h1<1e-5)continue;
    H[i]=h1;R[i]=h1*((1-f)*mr+f*A[0]);G[i]=h1*((1-f)*mg+f*A[1]);B[i]=h1*((1-f)*mb+f*A[2]);Wt[i]=h1*((1-f)*mw+f*tw);D[i]=h1*((1-f)*md+f);
  }
}
// wash: removes paint under the finger
function wash(s,gx,gy,r,amt){
  const {nx,ny,H,R,G,B,Wt,D}=s;
  const x0=Math.max(0,Math.floor(gx-r)),x1=Math.min(nx-1,Math.ceil(gx+r));
  const y0=Math.max(0,Math.floor(gy-r)),y1=Math.min(ny-1,Math.ceil(gy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const d=Math.hypot(x-gx,y-gy)/r;if(d>=1)continue;
    const k=1-Math.min(1,amt*(0.5+0.5*Math.cos(d*Math.PI))),i=y*nx+x;
    H[i]*=k;R[i]*=k;G[i]*=k;B[i]*=k;Wt[i]*=k;D[i]*=k;if(H[i]<0.004){H[i]=R[i]=G[i]=B[i]=Wt[i]=D[i]=0}
    const{HD,RD,GD,BD,WD}=s;HD[i]*=k;RD[i]*=k;GD[i]*=k;BD[i]*=k;WD[i]*=k;if(HD[i]<0.004){HD[i]=RD[i]=GD[i]=BD[i]=WD[i]=0}}
}
// finger acts like a spatula: paint under it follows its motion
function drag(s,gx,gy,r,vx,vy){
  const {nx,ny,FX,FY}=s;
  const x0=Math.max(0,Math.floor(gx-r)),x1=Math.min(nx-1,Math.ceil(gx+r));
  const y0=Math.max(0,Math.floor(gy-r)),y1=Math.min(ny-1,Math.ceil(gy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const d=Math.hypot(x-gx,y-gy)/r;if(d>=1)continue;
    const w=(0.5+0.5*Math.cos(d*Math.PI))*0.8,i=y*nx+x;
    FX[i]+= (vx-FX[i])*w;FY[i]+=(vy-FY[i])*w;
  }
}
function step(s){
  const {nx,ny,H,Hs,FX,FY,U,V,D,HD}=s,flow=s.flow,MX=0.45,TX=s.tx,TY=s.ty;
  for(let y=0;y<ny;y++){const yu=y>0?-nx:0,yd=y<ny-1?nx:0;
    for(let x=0;x<nx;x++){const i=y*nx+x,xl=x>0?-1:0,xr=x<nx-1?1:0;
      Hs[i]=(H[i]*4+H[i+xl]+H[i+xr]+H[i+yu]+H[i+yd]+HD[i]*4+HD[i+xl]+HD[i+xr]+HD[i+yu]+HD[i+yd])*0.125}}
  const M=s.M;
  for(let y=0;y<ny;y++){const yu=y>0?-nx:0,yd=y<ny-1?nx:0;
    for(let x=0;x<nx;x++){const i=y*nx+x,xl=x>0?-1:0,xr=x<nx-1?1:0;

// one finger pours; two fingers put down together rotate / zoom / move the board
let hinted=false;
const ptr=new Map(),act=new Map();let pair=null;
const brushR=()=>Math.max(2.2,Math.min(sim.nx,sim.ny)*0.018*cfg.bsz);   // starting drop: thin
function pick(n){if(sel<NS)return(sel+n)%NS;if(n===0)return sel;return(n-1)%NS}
const scr=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function toBoard(sx,sy){const c=Math.cos(view.a),s=Math.sin(view.a),dx=sx-(cv.clientWidth/2+view.ox),dy=sy-(cv.clientHeight/2+view.oy);
  return[(dx*c+dy*s)/view.z+BW/2,(-dx*s+dy*c)/view.z+BH/2]}
const toGrid=(sx,sy)=>{const [bx,by]=toBoard(sx,sy);return[bx/BW*sim.nx,by/BH*sim.ny]};
function startPour(id,p){const [x,y]=toGrid(p.sx,p.sy);p.role='pour';act.set(id,{p,px:x,py:y,k:pick(act.size),dw:0})}
function startPair(i1,p1,i2,p2){
  for(const [id,p] of [[i1,p1],[i2,p2]]){p.role='rot';act.delete(id)}
  const mx=(p1.sx+p2.sx)/2,my=(p1.sy+p2.sy)/2;
  pair={i1,i2,ang0:Math.atan2(p2.sy-p1.sy,p2.sx-p1.sx),d0:Math.max(20,Math.hypot(p2.sx-p1.sx,p2.sy-p1.sy)),a0:view.a,z0:view.z,b:toBoard(mx,my)}}
function updPair(){
  const p1=ptr.get(pair.i1),p2=ptr.get(pair.i2);if(!p1||!p2)return;
  const ang=Math.atan2(p2.sy-p1.sy,p2.sx-p1.sx),d=Math.hypot(p2.sx-p1.sx,p2.sy-p1.sy);
  view.a=pair.a0+(ang-pair.ang0);view.z=Math.min(3,Math.max(0.5,pair.z0*d/pair.d0));
  const mx=(p1.sx+p2.sx)/2,my=(p1.sy+p2.sy)/2,c=Math.cos(view.a),s=Math.sin(view.a);
  const bx=(pair.b[0]-BW/2)*view.z,by=(pair.b[1]-BH/2)*view.z;
  view.ox=mx-cv.clientWidth/2-(bx*c-by*s);view.oy=my-cv.clientHeight/2-(bx*s+by*c);
  el('reset').classList.add('show')}
cv.addEventListener('pointerdown',e=>{askSensor();if(!sim)return;cv.setPointerCapture(e.pointerId);
  const [sx,sy]=scr(e),now=performance.now(),p={sx,sy,x0:sx,y0:sy,t:now,role:'pending'};ptr.set(e.pointerId,p);
  if(!pair)for(const [id,q] of ptr)if(id!==e.pointerId&&q.role==='pending'&&now-q.t<170){startPair(id,q,e.pointerId,p);break}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;[p.sx,p.sy]=scr(e);
  if(p.role==='pending'&&Math.hypot(p.sx-p.x0,p.sy-p.y0)>14)startPour(e.pointerId,p);
  if(p.role==='rot'&&pair)updPair()});
const up=e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(p.role==='pending'){startPour(e.pointerId,p);pourFrame(act.get(e.pointerId),1/60)}   // quick tap: a small dot
  if(p.role==='rot'&&pair){const o=pair.i1===e.pointerId?pair.i2:pair.i1,q=ptr.get(o);if(q)q.role='none';pair=null}
  ptr.delete(e.pointerId);act.delete(e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
el('reset').onclick=()=>{view.a=0;view.z=1;view.ox=0;view.oy=0;el('reset').classList.remove('show')};
const colOf=k=>k===NS?whiteCol():k===NS+1?blackCol():slotCol(k);
function pourFrame(a,dt){
  const [x,y]=toGrid(a.p.sx,a.p.sy),r0=brushR();
  const dx=x-a.px,dy=y-a.py,d=Math.hypot(dx,dy),n=Math.max(1,Math.ceil(d/0.7));
  a.dw=a.dw*Math.exp(-d*0.12)+dt;                         // holding still -> the drop swells, faster and faster
  const g=Math.min(1,Math.pow(a.dw/0.85,1.7)),r=r0*(1+5.5*g);
  if(a.k===WASH){for(let k=1;k<=n;k++)wash(sim,a.px+dx*k/n,a.py+dy*k/n,Math.max(r,r0*2.5)*1.2,0.32)}
  else{const col=colOf(a.k),amt=(0.14+0.22*g)*cfg.bsz/n*Math.min(3,dt*60);   // same paint per second at any frame rate
    for(let k=1;k<=n;k++)deposit(sim,a.px+dx*k/n,a.py+dy*k/n,r,Math.max(amt,0.014),col)}
  a.px=x;a.py=y}
// ---------- loop ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(sim){
    const now2=performance.now();
    for(const [id,p] of ptr)if(p.role==='pending'&&now2-p.t>110)startPour(id,p);
    for(const a of act.values())pourFrame(a,dt);
    if(cfg.tilt!=='joy'&&sensorSeen){const k=Math.min(1,dt*9),dz=v=>Math.abs(v)<0.03?0:v;
      nx0+=(sx-nx0)*Math.min(1,dt/8);ny0+=(sy-ny0)*Math.min(1,dt/8);       // the pose you hold the phone in slowly becomes "level"
      let x=(sx-nx0)*cfg.sens,y=(sy-ny0)*cfg.sens;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
      tsx+=(dz(x)-tsx)*k;tsy+=(dz(y)-tsy)*k;tilt=[tsx,tsy]}
    {const c=Math.cos(view.a),s=Math.sin(view.a);sim.tx=tilt[0]*c+tilt[1]*s;sim.ty=-tilt[0]*s+tilt[1]*c}  // tilt is fixed to the screen
    step(sim);step(sim);
    if(GL){GL.draw(sim,view,BW,BH,cv.clientWidth,cv.clientHeight,dpr)}else{
    // draw only what is on screen, with a fixed pixel budget: zooming in = more detail, same cost
    const SW=cv.clientWidth,SH=cv.clientHeight;let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
    for(const [qx,qy] of [[0,0],[SW,0],[0,SH],[SW,SH]]){const [bx,by]=toBoard(qx,qy);bx0=Math.min(bx0,bx);by0=Math.min(by0,by);bx1=Math.max(bx1,bx);by1=Math.max(by1,by)}
    bx0=Math.max(0,bx0-4);by0=Math.max(0,by0-4);bx1=Math.min(BW,bx1+4);by1=Math.min(BH,by1+4);
    if(bx1>bx0&&by1>by0){
      const cw=BW/sim.nx,ch=BH/sim.ny,BUD=125000;
      const maxD=dpr*view.z;                                   // never finer than the screen itself
      let k=Math.sqrt(BUD/((bx1-bx0)*(by1-by0)));k=Math.min(k,maxD);
      const W2=Math.max(8,Math.round((bx1-bx0)*k)),H2=Math.max(8,Math.round((by1-by0)*k));
      if(off.width!==W2||off.height!==H2||!img){off.width=W2;off.height=H2;img=octx.createImageData(W2,H2)}
      sim.zoom=view.z;
      render(sim,img.data,W2,H2,bx0/cw,by0/ch,(bx1-bx0)/cw/W2,(by1-by0)/ch/H2);
      octx.putImageData(img,0,0);
      var drawRect=[bx0,by0,bx1-bx0,by1-by0]}
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#141414';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.translate(cv.clientWidth/2+view.ox,cv.clientHeight/2+view.oy);ctx.rotate(view.a);ctx.scale(view.z,view.z);ctx.translate(-BW/2,-BH/2);
    ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(0,0,BW,BH,16);else ctx.rect(0,0,BW,BH);ctx.clip();
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.fillStyle='#ece8e0';ctx.fillRect(0,0,BW,BH);if(drawRect)ctx.drawImage(off,0,0,off.width,off.height,...drawRect);ctx.restore()}}
  requestAnimationFrame(frame)}
applyLang();requestAnimationFrame(()=>placePal(true));requestAnimationFrame(frame);
})();
</script>
